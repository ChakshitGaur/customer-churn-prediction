# Runs the same checks as CI (ruff, black) on staged files before each commit.
# Setup once:  python -m pip install pre-commit  &&  pre-commit install
# Run on everything:  pre-commit run --all-files
# The tool versions below must match requirements.txt so local and CI results agree.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.17.3"]
        types: [python]
        files: ^(app|src|tests)/
      - id: black
        name: black
        entry: black --check
        language: python
        additional_dependencies: ["black==26.10.1"]
        types: [python]
        files: ^(app|src|tests)/
